name: OIX evidence interoperability

on:
  push:
    branches:
      - integration/oix-evidence-bridge
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oix-evidence-bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out Cyber Observatory
        uses: actions/checkout@v4
      - name: Check out Open Intelligence Exchange Phase 11
        uses: actions/checkout@v4
        with:
          repository: HuffmanMainNode/Open-Intelligence-Exchange
          ref: integration/phase-11-evidence-submit-contract
          path: Open-Intelligence-Exchange
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OIX and Cyber Observatory
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./Open-Intelligence-Exchange
          python -m pip install -e ".[dev]"
      - name: Run OIX bridge tests
        run: pytest tests/test_oix_bridge.py
      - name: Run synthetic SBOM evidence demonstration
        run: python examples/oix_evidence_bridge_demo.py
      - name: Run Cyber Observatory quality checks
        run: |
          pytest
          ruff check .
          bandit -q -r src
