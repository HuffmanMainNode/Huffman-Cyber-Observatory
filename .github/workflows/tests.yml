name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=84.1.0" wheel
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=huffman_cyber --cov-report=term-missing
      - run: ruff check .
      - run: bandit -q -r src
      - run: pip-audit --skip-editable