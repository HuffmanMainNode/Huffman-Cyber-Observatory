name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=84.1.0" wheel build
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=huffman_cyber --cov-report=term-missing
      - run: ruff check .
      - run: bandit -q -r src
      - run: pip-audit --skip-editable
      - name: Build source distribution and wheel
        run: python -m build
      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv /tmp/hco-wheel-smoke
          /tmp/hco-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/hco-wheel-smoke/bin/hco --help
          /tmp/hco-wheel-smoke/bin/python -c "from huffman_cyber import __version__; print(__version__)"
      - name: Smoke-test the source distribution in a clean environment
        run: |
          python -m venv /tmp/hco-sdist-smoke
          /tmp/hco-sdist-smoke/bin/python -m pip install dist/*.tar.gz
          /tmp/hco-sdist-smoke/bin/hco --help
          /tmp/hco-sdist-smoke/bin/python -c "from huffman_cyber import __version__; print(__version__)"

      - name: Smoke-test immutable Git installation
        run: |
          python -m venv /tmp/hco-git-smoke
          /tmp/hco-git-smoke/bin/python -m pip install "git+https://github.com/HuffmanMainNode/Huffman-Cyber-Observatory.git@d7ea2d27bea7829abdd663675d76e4ab1a7ee734"
          /tmp/hco-git-smoke/bin/hco --help
          /tmp/hco-git-smoke/bin/python -c "from huffman_cyber import __version__; print(__version__)"
