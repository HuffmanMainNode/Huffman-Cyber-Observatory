name: release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Generate SHA-256 manifest
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          artifacts = sorted(
              path for path in Path("dist").iterdir()
              if path.is_file() and path.name != "SHA256SUMS.txt"
          )
          if not artifacts:
              raise SystemExit("No release artifacts were produced")

          manifest = "".join(
              f"{sha256(path.read_bytes()).hexdigest()}  {path.name}\n"
              for path in artifacts
          )
          Path("dist/SHA256SUMS.txt").write_text(manifest, encoding="utf-8")
          PY

      - name: Generate GitHub build provenance attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt

      - name: Verify generated attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt; do
            test -f "$artifact"
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done

      - name: Upload release artifacts and checksum manifest
        uses: actions/upload-artifact@v7
        with:
          name: hco-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
