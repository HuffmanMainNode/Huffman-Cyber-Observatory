[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huffman-cyber-observatory"
version = "0.1.0"
description = "Local-first defensive security and cryptography toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["cryptography>=42.0"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
hco = "huffman_cyber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]